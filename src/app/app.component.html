<ion-app>
  <ion-split-pane
    contentId="main-content"
    >

    <ion-menu
      menuId="iapep-menu"
      contentId="main-content"
      type="overlay"
      [disabled]="!menuDisponivel()">

      <ion-content>
        <div class="sidebar">

          <!-- Identidade visual -->
          <div class="brand">
            <div class="brand-icon">
              <img
                src="assets/logos/IAPEP-para-02-2.png"
                alt="Logotipo do IAPEP">
            </div>

            <div>
              <h1>IAPEP</h1>
              <span>SISTEMA INTERATIVO</span>
            </div>
          </div>

          <!-- Identificação da área -->
          <div class="section-title">
            {{ tituloSecao }}
          </div>

          <!-- Navegação -->
          <ion-list>
            @for (p of appPages; track p.rota) {
              <ion-menu-toggle auto-hide="false">
                <ion-item
                  [routerLink]="p.rota"
                  routerDirection="root"
                  routerLinkActive="selected"
                  lines="none"
                  [detail]="false">

                  <ion-icon
                    slot="start"
                    [name]="p.icone">
                  </ion-icon>

                  <ion-label>
                    {{ p.titulo }}
                  </ion-label>

                </ion-item>
              </ion-menu-toggle>
            }
          </ion-list>

          <!-- Rodapé -->
          <div class="sidebar-footer">
            <ion-icon name="person-circle-outline">
            </ion-icon>

            <div>
              <strong>{{ tituloPerfil }}</strong>
              <span>IAPEP — Sistema Interativo</span>
            </div>
          </div>

        </div>
      </ion-content>
    </ion-menu>

    <ion-router-outlet
      id="main-content">
    </ion-router-outlet>

  </ion-split-pane>
</ion-app>
