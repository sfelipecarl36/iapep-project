
<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <div class="sidebar">
          <div class="brand">
            <div class="brand-icon"><img src="assets/logos/IAPEP-para-02-2.png"></div>
            <div>
              <h1>IAPEP</h1>
              <span>SISTEMA INTERATIVO</span>
            </div>
          </div>

          <div class="section-title">ADMINISTRAÇÃO</div>

          <ion-list>
            @for (p of appPages; track p.url) {
              <ion-menu-toggle auto-hide="false">
                <ion-item
                  [routerLink]="p.url"
                  routerDirection="root"
                  routerLinkActive="selected"
                  lines="none"
                  detail="false">
                  <ion-icon
                    slot="start"
                    [name]="p.icon">
                  </ion-icon>
                  <ion-label>{{ p.title }}</ion-label>
                </ion-item>
              </ion-menu-toggle>
            }
          </ion-list>

          <div class="sidebar-footer">
            <ion-icon name="person-circle-outline"></ion-icon>
            <div>
              <strong>Administrador</strong>
              <span>Ambiente demonstrativo</span>
            </div>
          </div>
        </div>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
